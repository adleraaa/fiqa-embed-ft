[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fiqa-embed-ft"
version = "0.1.0"
description = "Fine-tuning bge-small-en-v1.5 for FiQA-2018 retrieval on one 8 GB laptop GPU"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "torch>=2.4",
    "bm25s>=0.2",
    "PyStemmer>=2.2",
]

[project.optional-dependencies]
train = [
    "sentence-transformers>=6.1,<7",  # train.py imports 6.x module paths
    "datasets>=3.0",
    "accelerate>=1.0",
    "peft>=0.13",
    "matplotlib>=3.8",
]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["fiqa_ft"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
